apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: sujitht007/gateway:latest
        imagePullPolicy: Never
        env:
        - name: PRODUCT_SERVICE_URL
          value: http://product-service:3001
        - name: CART_SERVICE_URL
          value: http://cart-service:3002
        - name: METRICS_SERVICE_URL
          value: http://metrics-service:3003
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30008
